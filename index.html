<style>
/* Layout: gesture notes beside an iPhone frame; the frame runs the prototype. Single dark look, matching the app. */
:root {
  --bg: #07090c;
  --panel: #0e1217;
  --ink: #f4f6f8;
  --ink-2: #9aa4b2;
  --ink-3: #5c6573;
  --blue: #0770e3;
  --fab: #0b3f8c;
  --orange: #fc790d;
  --red: #e53935;
  --card: #0d1117;
  --card-2: #161b22;
  --line-blue: rgba(28, 63, 115, .75);
  --line-mute: rgba(255, 255, 255, .06);
  --font: -apple-system, "SF Pro Text", "Figtree", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0; -webkit-font-smoothing: antialiased; }
input { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.stage { min-height: 100%; display: flex; gap: 56px; align-items: center; justify-content: center; padding: 32px 16px; flex-wrap: wrap; }
.notes { max-width: 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.notes h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.notes p { margin: 0; color: var(--ink-2); line-height: 1.5; font-size: 14px; }
.eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.gestures { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; font-size: 13.5px; margin: 0; }
.gestures dt { color: var(--ink); font-weight: 600; white-space: nowrap; }
.gestures dd { margin: 0; color: var(--ink-2); }
.reset { align-self: flex-start; font-size: 13px; color: var(--ink-2); border: 1px solid var(--line-mute); padding: 8px 14px; border-radius: 99px; }
.reset:hover { color: var(--ink); border-color: rgba(255,255,255,.2); }

.phone { flex: none; }
.screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: #000; isolation: isolate; clip-path: inset(0 round 44px); border-radius: 44px; font-size: 16px; user-select: none; -webkit-user-select: none; }
@media (max-width: 560px) {
  .stage { gap: 24px; padding-block: 20px; }
  .notes { max-width: 100%; }
  .phone { padding: 0; background: none; box-shadow: none; width: 100%; }
  .screen { width: 100%; height: min(844px, calc(100dvh - 40px)); border-radius: 28px; clip-path: inset(0 round 28px); }
}

/* Status bar & home indicator */
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 14px 30px 0 36px; font-weight: 600; font-size: 16px; pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.screen.sheet-open .home-ind { opacity: 0; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 60; pointer-events: none; }

/* Views & navigation */
.view { position: absolute; inset: 0; background: #000; transform: translateX(100%); transition: transform .42s cubic-bezier(.3,.85,.25,1), filter .42s; will-change: transform; }
.view.in { transform: none; }
.view.behind { transform: translateX(-28%); filter: brightness(.55); }
.view.instant { transition: none; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 108px 16px 130px; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.nav { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 50px 16px 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; isolation: isolate; }
/* iOS 26+ scroll-edge effect: no bar, content blurs & dims as it slides under the floating controls */
.nav::before { content: ""; position: absolute; inset: 0 0 -28px; z-index: -1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.92), rgba(0,0,0,.7) 55%, rgba(0,0,0,0)); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(12px); -webkit-mask-image: linear-gradient(#000 50%, transparent); mask-image: linear-gradient(#000 50%, transparent); opacity: 0; transition: opacity .25s; }
.nav.scrolled::before { opacity: 1; }
.nav-title { font-size: 17px; font-weight: 600; letter-spacing: -.2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; color: #fff; }
.nav-right { justify-self: end; display: flex; gap: 8px; }
.nav-left { justify-self: start; }

/* Liquid Glass (iOS 26+): clear lens, specular rim, soft inner light, grows on touch */
.glass { position: relative; isolation: isolate; background: linear-gradient(180deg, rgba(58,62,72,.82), rgba(30,33,40,.86) 60%, rgba(40,44,52,.86)); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px .5px rgba(255,255,255,.55), inset 0 -1px .5px rgba(255,255,255,.18), inset 1px 0 .5px rgba(255,255,255,.2), inset -1px 0 .5px rgba(255,255,255,.12), inset 0 0 14px rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.35); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; background: radial-gradient(90% 70% at 28% 8%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), radial-gradient(70% 50% at 80% 100%, rgba(255,255,255,.08), rgba(255,255,255,0) 70%); }
.gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: transform .35s cubic-bezier(.3,1.7,.5,1), filter .2s; }
.gbtn:active, .gcap .gi:active { transform: scale(1.12); filter: brightness(1.25); }
.pill:active, .fab:active { transform: scale(1.06); filter: brightness(1.15); }
.gbtn svg, .gi svg { width: 24px; height: 24px; }
.gbtn.danger { color: #ff453a; }
.gcap { display: flex; align-items: center; height: 44px; border-radius: 22px; padding: 0 2px; }
.gi { width: 44px; height: 44px; display: grid; place-items: center; color: #fff; border-radius: 50%; transition: transform .35s cubic-bezier(.3,1.7,.5,1), filter .2s; }
.pill { height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 600; font-size: 17px; color: var(--orange); transition: transform .35s cubic-bezier(.3,1.7,.5,1), filter .2s; }

.fab-wrap { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; z-index: 20; pointer-events: none; }
.fab { pointer-events: auto; position: relative; isolation: isolate; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 72px; color: #fff; font-weight: 500; font-size: 16px;
  /* Same Liquid Glass recipe as the nav buttons, tinted brand blue: clear lens, thin specular rim, neutral shadow, no gloss */
  background: #033e80;   /* Indian Blue/B700, solid so the + icon matches it exactly */
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px .5px rgba(255,255,255,.5), inset 0 -1px .5px rgba(255,255,255,.16), inset 1px 0 .5px rgba(255,255,255,.18), inset -1px 0 .5px rgba(255,255,255,.1), inset 0 0 12px rgba(255,255,255,.05),
    0 2px 6px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.45);
  transition: transform .35s cubic-bezier(.3,1.7,.5,1), filter .2s; }
.fab::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 45%); }
.fab:active { filter: brightness(1.18); }
.fab .plus { box-shadow: 0 2px 6px rgba(0,0,0,.25), inset 0 -1px 1px rgba(0,0,0,.08); }
.fab .plus { width: 30px; height: 30px; border-radius: 34px; background: #fff; border: 1px solid #0552a6; color: #033e80; display: grid; place-items: center; flex: none; }
.fab .plus svg { width: 20px; height: 20px; }
.fab .plus svg path { stroke: currentColor; stroke-width: .5px; stroke-linejoin: round; } /* Figma Add: 0.5pt stroke */
.fab.big { padding: 10px 16px 10px 10px; gap: 10px; }
.fab.big .plus { width: 36px; height: 36px; }
.fab.big .plus svg { width: 24px; height: 24px; }
.fab .t { font-size: 18px; line-height: 1.2; font-weight: 600; color: #fff; }
.fab .s { font-size: 12px; font-weight: 400; opacity: .75; }
.fab .chev { margin-left: 22px; opacity: .9; width: 20px; height: 20px; }

/* Rows */
.rows { display: flex; flex-direction: column; gap: 12px; position: relative; }
.row-wrap { position: relative; border-radius: 18px; }
.swipe-bg { position: absolute; inset: 0; border-radius: 18px; display: flex; justify-content: space-between; align-items: stretch; opacity: 0; transition: opacity .15s; }

          showMenu(w.getBoundingClientRect(), [
            { label: 'Open', icon: I.open, action: () => push(Detail(id)) },
            { label: 'Edit list', icon: I.pencil, action: () => push(ListForm(id)) },
            { label: 'Duplicate', icon: I.dup, action: () => { const i = lists.indexOf(l); lists.splice(i + 1, 0, { id: uid(), name: l.name + ' copy', ill: l.ill, items: l.items.map(x => ({ id: uid(), title: x.title, checked: false })) }); save(); flip(cards, v.refresh); toast('List duplicated'); } },
            { label: 'Uncheck all items', icon: I.undo, disabled: !l.items.some(x => x.checked), action: () => { l.items.forEach(x => x.checked = false); save(); v.refresh(); } },
            '-',
            { label: 'Delete list', icon: I.trash, danger: true, action: () => askDelete(w) }
          ], { align: 'left', onClose: () => w.classList.remove('ctx') });
        }
      }));
      if (enterListId) {
        const w = cards.querySelector(`.lwrap[data-id="${enterListId}"]`); enterListId = null;
        if (w) {
          const h = w.offsetHeight;
          w.style.cssText = 'height:0;margin-bottom:-10px;opacity:0;overflow:hidden';
          setTimeout(() => {
            const sc = v.el.querySelector('.scroll');
            const top = cards.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 230;
            sc.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            const open = w.animate([{ height: '0px', marginBottom: '-10px' }, { height: h + 'px', marginBottom: '0px' }], { duration: 360, easing: 'cubic-bezier(.3,.9,.3,1)' });
            open.onfinish = () => {
              w.style.cssText = '';
              w.animate([{ opacity: 0, transform: 'scale(.9) translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.3,1.5,.5,1)' });
              haptic(10);
            };
          }, 460);
        }
      }
    };
    v.refresh();
    return v;
  }

  // ================= List detail =================
  function Detail(listId) {
    const v = { name: 'detail' };
    let adding = false, editingId = null;
    v.el = el(`<div class="nav"><button class="gbtn glass nav-left back" type="button" aria-label="Back">${I.back}</button><div class="nav-title"></div><div class="nav-right"></div></div>
      <div class="scroll"><div class="head"></div><div class="rows"></div><div class="empty-slot"></div></div>
      <div class="fab-wrap"><button class="fab" type="button"><span class="plus">${I.plus}</span>Add item</button></div>`);
    const $ = s => v.el.querySelector(s);
    const rowsEl = $('.rows'), scroller = $('.scroll');
    const L = () => getList(listId);
    $('.back').onclick = () => { commitAll(); pop(); };
    const fab = $('.fab'); keepFocus(fab);
    fab.onclick = () => startAdding();

    function renderNav() {
      const l = L(); if (!l) return;
      $('.nav-title').textContent = l.name;
      const r = $('.nav-right');
      if (adding || editingId) {
        r.innerHTML = `<button class="pill glass save" type="button">Save list</button>`;
        const b = r.firstChild; keepFocus(b);
        b.onclick = () => { commitAll(); toast('List saved'); };
      } else {
        // Only the Edit action in the nav bar (Media Library "Edit" in a Liquid Glass circle).
        r.innerHTML = `<button class="gbtn glass" type="button" aria-label="Edit list">${I.pencil}</button>`;
        r.firstChild.onclick = () => push(ListForm(listId));
      }
    }
    function renderHead() {
      const l = L(); const n = l.items.length, p = l.items.filter(i => i.checked).length;
      // No progress bar or "All packed" banner: the list matches the Figma screen.
      $('.head').innerHTML = '';
      $('.empty-slot').innerHTML = !n && !adding ? `<div class="empty"><span class="empty-art">${illHTML(l.ill)}</span><b>Your list is empty</b><small>Tap “Add item” to start packing</small></div>` : '';
      
    }
    function renderRows() {
      const l = L();
      rowsEl.innerHTML = (adding ? inputHTML('new-input', '', 'Enter item name', false) : '') +
        l.items.map(it => editingId === it.id ? `<div data-id="${it.id}">${inputHTML('edit-input', it.title, 'Item name', true)}</div>` : rowHTML(it)).join('');
      rowsEl.querySelectorAll('.row-wrap').forEach(w => bindRow(w, {
        container: rowsEl, scroller,
        onTap: (wrap, target) => { const it = find(wrap); if (target.closest('.cb')) toggle(it, wrap); else beginEdit(it); },
        onToggle: wrap => toggle(find(wrap), wrap),
        onDelete: wrap => deleteItem(find(wrap), wrap),
        onMenu: wrap => {
          const it = find(wrap); wrap.classList.add('ctx');
          showMenu(wrap.getBoundingClientRect(), [
            { label: 'Edit', icon: I.pencil, action: () => beginEdit(it) },
            { label: it.checked ? 'Mark as not packed' : 'Mark as packed', icon: I.circleCheck, action: () => toggle(it, wrap) },
            { label: 'Duplicate', icon: I.dup, action: () => { const l = L(); const i = l.items.indexOf(it); l.items.splice(i + 1, 0, { id: uid(), title: it.title, checked: false }); save(); refresh(true); } },
            '-',
            { label: 'Delete', icon: I.trash, danger: true, action: () => deleteItem(it, wrap) }
          ], { align: 'left', onClose: () => wrap.classList.remove('ctx') });
        },
        onReorder: (from, to) => { const l = L(); const [m] = l.items.splice(from, 1); l.items.splice(to, 0, m); save(); renderRows(); }
      }));
      const ni = rowsEl.querySelector('.new-input input');
      if (ni) { bindInput(ni, { onEnter: val => commitNew(val, true), onBlurCommit: val => commitNew(val, false), onClear: () => commitNew('', false) }); ni.focus(); }
      const ei = rowsEl.querySelector('.edit-input input');
      if (ei) { bindInput(ei, { onEnter: val => commitEdit(val), onBlurCommit: val => commitEdit(val), onClear: () => {} }); ei.focus(); ei.setSelectionRange(ei.value.length, ei.value.length); }
    }
    const find = wrap => L().items.find(i => i.id === wrap.dataset.id);
    function refresh(animate = false) {
      if (!L()) return;
      renderNav(); renderHead();
      animate ? flip(rowsEl, renderRows) : renderRows();
    }
    v.refresh = () => refresh();

    function startAdding() {
      if (editingId) { const ei = rowsEl.querySelector('.edit-input input'); commitEdit(ei ? ei.value : ''); }
      if (adding) { const ni = rowsEl.querySelector('.new-input input'); commitNew(ni.value, true); return; }
      adding = true; scroller.scrollTo({ top: 0, behavior: 'smooth' });
      renderNav(); renderHead(); flip(rowsEl, renderRows);
    }
    function commitNew(val, keep) {
      if (!adding) return;
      const parts = splitItems(val), t = parts.length;
      if (t) { L().items.unshift(...parts.map(p => ({ id: uid(), title: p, checked: false }))); save(); haptic(6); }
      if (!keep || !t) adding = false;
      renderNav(); renderHead(); flip(rowsEl, renderRows);
    }
    function beginEdit(it) {
      if (adding) { const ni = rowsEl.querySelector('.new-input input'); adding = false; if (ni) L().items.unshift(...splitItems(ni.value).map(p => ({ id: uid(), title: p, checked: false }))); }
      editingId = it.id; refresh();
    }
    function commitEdit(val) {
      if (!editingId) return;
      const it = L().items.find(i => i.id === editingId);
      const parts = splitItems(val);
      if (it && parts.length) { it.title = parts[0]; const at = L().items.indexOf(it) + 1; L().items.splice(at, 0, ...parts.slice(1).map(p => ({ id: uid(), title: p, checked: false }))); }
      editingId = null; save(); refresh();
    }
    function commitAll() {
      const ni = rowsEl.querySelector('.new-input input'); if (ni) commitNew(ni.value, false);
      const ei = rowsEl.querySelector('.edit-input input'); if (ei) commitEdit(ei.value);
    }
    function toggle(it, wrap) {
      haptic(8);
      it.checked = !it.checked; save();
      const row = wrap && wrap.querySelector('.row');
      if (row) { row.classList.toggle('checked', it.checked); row.setAttribute('aria-checked', it.checked); const al = wrap.querySelector('.act-left'); if (al) al.lastChild.textContent = it.checked ? ' Unpack' : ' Packed'; }
      renderHead();
      if (!it.checked) return;                 // uncheck: keep position
      setTimeout(() => {                         // check: slide to the end
        const l = L(); if (!l) return;
        const i = l.items.indexOf(it);
        if (i < 0 || !it.checked || i === l.items.length - 1) return;
        l.items.splice(i, 1); l.items.push(it); save();
        if (!editingId && !adding) flip(rowsEl, renderRows); else refresh(true);
      }, 450);
    }
    function deleteItem(it, wrap) {
      const l = L(); const idx = l.items.indexOf(it); if (idx < 0) return;
      haptic(15);
      collapseOut(wrap, () => {
        l.items.splice(idx, 1); save(); renderHead(); flip(rowsEl, renderRows); renderNav();
      });
    }
    function deletePacked() {
      const l = L(); const snap = l.items.map((it, i) => [it, i]).filter(([it]) => it.checked);
      l.items = l.items.filter(i => !i.checked); save(); refresh(true);
    }
    function deleteList() {
      popToLanding();
      setTimeout(() => { lists = lists.filter(x => x.id !== listId); save(); const land = stack.find(s => s.name === 'landing'); land && flip(land.el.querySelector('.cards'), land.refresh); toast('The list is successfully deleted'); }, 420);
    }
    refresh();
    return v;
  }

  // ================= Create / edit list =================
  function ListForm(listId) {
    const v = { name: 'form' };
    const editing = !!listId;
    const src = editing ? getList(listId) : null;
    let title = src ? src.name : '';
    let items = src ? src.items.map(i => ({ ...i, src: i.id })) : [];
    const orig = JSON.stringify([title, items]);
    let adding = false, editingId = null;
    const changed = () => JSON.stringify([title, items]) !== orig || (rowsEl.querySelector('.new-input input')?.value.trim() || '') !== '';

    v.el = el(`<div class="nav"><button class="gbtn glass nav-left back" type="button" aria-label="Back">${I.back}</button><div class="nav-title">${editing ? 'Edit list' : 'Create new list'}</div><div class="nav-right">${editing ? `<button class="gbtn glass danger del" type="button" aria-label="Delete list">${I.trash}</button>` : ''}</div></div>
      <div class="scroll" style="padding-bottom:120px">
        <div class="form-label"><span class="sec-label" style="margin:0">List title</span></div>
        ${inputHTML('title-input', title, 'Enter list name', false)}
        <div class="field-error" id="title-error" role="alert" hidden>${I.bang}<span>Please add a list name to save this list</span></div>
        <div class="form-label" style="margin-top:28px"><span class="sec-label" style="margin:0">Items</span><button class="addlink" type="button">${I.plus} Add item</button></div>
        <div class="rows"></div>
      </div>
      <div class="savebar"><button class="primary" type="button">${editing ? 'Save changes' : 'Save list'}</button></div>`);
    const $ = s => v.el.querySelector(s);
    const rowsEl = $('.rows'), scroller = $('.scroll'), saveBtn = $('.primary');
    const titleIn = $('.title-input input');
    // Create: Save stays enabled; an empty title is flagged on the field itself (no toast). Edit: enabled once something changed.
    const updateSave = () => { saveBtn.disabled = editing && !changed(); };
    const titleRow = $('.title-input'), titleErr = $('#title-error');
    const setTitleError = on => { titleRow.classList.toggle('error', on); titleErr.hidden = !on; titleIn.setAttribute('aria-invalid', on); if (on) { titleRow.style.animation = 'none'; void titleRow.offsetWidth; titleRow.style.animation = ''; } };
    titleIn.addEventListener('input', () => { title = titleIn.value; if (title.trim()) setTitleError(false); updateSave(); });
    bindInput(titleIn, { onEnter: () => startAdding(), onBlurCommit: () => {}, onClear: () => {} });
    const addlink = $('.addlink'); keepFocus(addlink); addlink.onclick = () => startAdding();
    keepFocus(saveBtn);
    $('.back').onclick = () => { flushInputs(); if (changed()) showSheet('exit', pop); else pop(); };
    if (editing) $('.del').onclick = () => showSheet('delete', () => {
      popToLanding();
      setTimeout(() => { lists = lists.filter(x => x.id !== listId); save(); const land = stack.find(s => s.name === 'landing'); land && flip(land.el.querySelector('.cards'), land.refresh); toast('The list is successfully deleted'); }, 420);
    });

    function render() {
      rowsEl.innerHTML = (adding ? inputHTML('new-input', '', 'Enter item name', false) : '') +
        items.map(it => editingId === it.id ? `<div data-id="${it.id}">${inputHTML('edit-input', it.title, 'Item name', true)}</div>` : rowHTML(it, { checkbox: false })).join('') +
        (!items.length && !adding ? '<div class="hint">Tap “+ Add item” to start filling this list.</div>' : '');
      rowsEl.querySelectorAll('.row-wrap').forEach(w => bindRow(w, {
        container: rowsEl, scroller,
        onTap: wrap => { editingId = wrap.dataset.id; adding = false; flip(rowsEl, render); },
        onDelete: wrap => collapseOut(wrap, () => { items = items.filter(i => i.id !== wrap.dataset.id); flip(rowsEl, render); updateSave(); }),
        onReorder: (from, to) => { const [m] = items.splice(from, 1); items.splice(to, 0, m); render(); updateSave(); }
      }));
      const ni = rowsEl.querySelector('.new-input input');
      if (ni) {
        ni.addEventListener('input', updateSave);
        bindInput(ni, { onEnter: val => commitNew(val, true), onBlurCommit: val => commitNew(val, false), onClear: () => commitNew('', false) });
        ni.focus();
      }
      const ei = rowsEl.querySelector('.edit-input input');
      if (ei) { bindInput(ei, { onEnter: commitEdit, onBlurCommit: commitEdit, onClear: () => {} }); ei.focus(); }
      updateSave();
    }
    function startAdding() {
      flushEdit();
      if (adding) { commitNew(rowsEl.querySelector('.new-input input').value, true); return; }
      adding = true; flip(rowsEl, render);
    }
    function commitNew(val, keep) {
      if (!adding) return;
      const parts = splitItems(val), t = parts.length;
      if (t) { items.unshift(...parts.map(p => ({ id: uid(), title: p, checked: false }))); haptic(6); }
      if (!keep || !t) adding = false;
      flip(rowsEl, render);
    }
    function commitEdit(val) {
      if (!editingId) return;
      const it = items.find(i => i.id === editingId);
      const parts = splitItems(val);
      if (it && parts.length) { it.title = parts[0]; items.splice(items.indexOf(it) + 1, 0, ...parts.slice(1).map(p => ({ id: uid(), title: p, checked: false }))); }
      editingId = null; render();
    }
    function flushEdit() { const ei = rowsEl.querySelector('.edit-input input'); if (ei) commitEdit(ei.value); }
    function flushInputs() { flushEdit(); const ni = rowsEl.querySelector('.new-input input'); if (ni && ni.value.trim()) { items.unshift(...splitItems(ni.value).map(p => ({ id: uid(), title: p, checked: false }))); ni.value = ''; } }

    saveBtn.onclick = () => {
      flushInputs(); adding = false;
      if (!title.trim()) {
        render(); setTitleError(true); haptic([12, 50, 12]);
        scroller.scrollTo({ top: 0, behavior: 'smooth' }); titleIn.focus();
        return;
      }
      haptic([8, 30, 8]);
      const clean = items.map(i => ({ id: i.src || i.id, title: i.title, checked: i.checked }));
      if (editing) {
        const l = getList(listId); l.name = title.trim(); l.ill = illFor(l.name); l.items = clean; save();
        pop(); toast('Changes saved successfully');
      } else {
        // Back to the Packing list page: the cards part to make room, then the new list drops in at the top.
        const l = { id: uid(), name: title.trim(), ill: illFor(title), items: clean };
        lists.unshift(l); save();
        enterListId = l.id;
        pop();
        setTimeout(() => toast('List created successfully!'), 900);
      }
    };
    v.onShow = () => { if (!editing) titleIn.focus(); };
    render();
    return v;
  }

  // ---------- Boot ----------
  push(TripHome(), { animate: false });
  document.getElementById('reset').onclick = () => {
    lists = seed(); save();
    while (stack.length) stack.pop().el.remove();
    push(TripHome(), { animate: false });
    toast('Demo data reset');
  };
})();
</script>
</html>
